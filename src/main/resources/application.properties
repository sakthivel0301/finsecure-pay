server.port=8080
spring.application.name=finsecure-pay
app.version=${APP_VERSION:1.0.0}

# Actuator / Prometheus (Task 6) + k8s probes
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=finsecure-pay

# Logs to stdout so `kubectl logs` and EFK can collect them
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.finsecure=${LOG_LEVEL:INFO}
